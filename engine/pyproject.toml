[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textbook-video-engine"
version = "0.1.0"
description = "AI Textbook-to-Video Classroom Designer - local Python video engine"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24", "Pillow>=10.0", "pydantic>=2.6", "imageio-ffmpeg>=0.5", "edge-tts>=7.0"]
