name: textbook_video_classroom
description: "AI Textbook-to-Video Classroom Designer — free, no API key: upload a textbook PDF, ask doubts, get teaching videos."
publish_to: "none"
version: 0.31.0+33

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  video_player: ^2.8.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.3
  pdfx: 2.6.0
  flutter_tts: 4.0.2
  flutter_secure_storage: ^9.2.2
  flutter_inappwebview: ^6.1.5
  audioplayers: 6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
