name: textbook_video_classroom
description: AI Textbook-to-Video Classroom Designer — upload a textbook PDF, ask doubts, get teaching videos.
publish_to: "none"
version: 0.11.0+11

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  video_player: ^2.8.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.3
  syncfusion_flutter_pdf: ^27.2.5
  http: ^1.2.2
  pointycastle: ^3.9.1
  web_socket_channel: ^2.4.0
  flutter_secure_storage: ^9.2.2
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
