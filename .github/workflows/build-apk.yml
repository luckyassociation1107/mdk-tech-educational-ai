name: Build Android APK

# Builds the AI Textbook Classroom app in the cloud and attaches the
# APK as a downloadable artifact (and to a Release when a v* tag is pushed).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "engine/**"
      - ".github/workflows/build-apk.yml"
  create:

permissions:
  contents: write

jobs:
  build-apk:
    if: github.event_name != 'create' || github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Sync the Python engine into the Android app
        run: bash tools/sync_engine_to_android.sh

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Write android/local.properties
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.sdk=$FLUTTER_SDK"
            echo "flutter.buildMode=release"
            echo "flutter.versionName=0.2.0"
            echo "flutter.versionCode=2"
          } > app/android/local.properties
          cat app/android/local.properties

      - name: Build release APK (arm64)
        working-directory: app/android
        run: >
          ./gradlew assembleRelease
          -Ptarget-platform=android-arm64
          -Ptarget=lib/main.dart
          -Pbase-application-name=android.app.Application
          -Pdart-obfuscation=false
          -Ptrack-widget-creation=true
          -Ptree-shake-icons=true
          --console=plain

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build -name "app-release.apk" -exec cp {} dist/AI_Textbook_Classroom.apk \;
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Textbook_Classroom-apk
          path: dist/AI_Textbook_Classroom.apk
          retention-days: 30

      - name: Attach APK to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AI_Textbook_Classroom.apk
