name: Build Windows EXE

# Builds the AI Textbook Classroom Windows app in the cloud and attaches
# a ready-to-run ZIP (AI_Textbook_Classroom.exe + its runtime files) as a
# downloadable artifact (and to a Release when a v* tag is pushed).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Enable Windows desktop + generate Windows scaffold
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.mdk --project-name textbook_video_classroom .

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package EXE
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          Rename-Item "$rel/textbook_video_classroom.exe" "AI_Textbook_Classroom.exe"
          New-Item -ItemType Directory -Force -Path "../dist" | Out-Null
          Compress-Archive -Path "$rel/*" -DestinationPath "../dist/AI_Textbook_Classroom_Windows.zip" -Force
          Get-ChildItem "../dist"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Textbook_Classroom-windows
          path: dist/AI_Textbook_Classroom_Windows.zip
          retention-days: 30

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AI_Textbook_Classroom_Windows.zip
