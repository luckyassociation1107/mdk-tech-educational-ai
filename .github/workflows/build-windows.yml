name: Build Windows EXE

# Builds the AI Textbook Classroom Windows app in the cloud, then wraps it
# in an Inno Setup installer (install/uninstall via Windows Settings) and
# also keeps a portable ZIP. Artifacts below; v* tags also get a Release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "installer/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Enable Windows desktop + generate Windows scaffold
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.mdk --project-name textbook_video_classroom .

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Stage app files
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          Rename-Item "$rel/textbook_video_classroom.exe" "AI_Textbook_Classroom.exe"
          New-Item -ItemType Directory -Force -Path "../dist/windows_app" | Out-Null
          Copy-Item "$rel/*" "../dist/windows_app/" -Recurse -Force
          Get-ChildItem "../dist/windows_app" | Select-Object Name

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $src = (Resolve-Path "../dist/windows_app").Path
          $out = (Resolve-Path "../dist").Path
          $iss = (Resolve-Path "../installer/AI_Textbook_Classroom.iss").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSourceDir=$src" "/DOutputDir=$out" $iss
          Get-ChildItem $out

      - name: Also package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "../dist/windows_app/*" -DestinationPath "../dist/AI_Textbook_Classroom_Windows.zip" -Force

      - name: Upload Windows installer + portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AI_Textbook_Classroom-windows
          path: |
            dist/AI_Textbook_Classroom_Setup.exe
            dist/AI_Textbook_Classroom_Windows.zip
          retention-days: 30

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AI_Textbook_Classroom_Setup.exe
            dist/AI_Textbook_Classroom_Windows.zip
